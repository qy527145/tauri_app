[package]
name = "{{project-name}}"
version = "0.1.0"
description = "{{project-name}} desktop app"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

# lib 名带 `_lib` 后缀，避免在 Windows 上与同名 bin 冲突：
# https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "{{crate_name}}_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dotenvy = "0.15"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
thiserror = "2"

# 只在桌面端有意义的插件，移动端编译时自动跳过。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"

[lints.rust]
unsafe_code = "forbid"
# MSVC 链接 cdylib 时会输出 "Creating library *.dll.lib"，新版 rustc 把它当成警告，纯属噪音。
linker_messages = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `#[tauri::command]` 要求按值接收参数。
needless_pass_by_value = "allow"

# 桌面安装包优先体积：https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
